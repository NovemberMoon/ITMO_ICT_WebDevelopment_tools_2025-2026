site_name: Лабораторные работы
site_url: https://NovemberMoon.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026/
theme:
    name: material
    language: ru
    palette:
        # Схема для светлой темы
        - scheme: default
          primary: indigo
          accent: purple
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        # Схема для темной темы
        - scheme: slate
          primary: indigo
          accent: lime
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - toc.follow
        - search.suggest
        - search.highlight
        - content.code.copy
markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
    - Главная: index.md
    - Лабораторная работа №1:
          - Отчет: lab-1/lab-1_report.md
